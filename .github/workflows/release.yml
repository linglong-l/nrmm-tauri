name: nrmm-tauri-release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  CARGO_PROFILE_RELEASE_STRIP: true
  ARCH: 'x86_64'

jobs:
  build-windows:
    name: Build Windows (NSIS + portable zip)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust dependencies (Windows)
        run: |
          rustup target add x86_64-pc-windows-msvc
          npm install -g @tauri-apps/cli@2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (Windows) with log capture
        id: build_win
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $ProgressPreference = "SilentlyContinue"
          $target = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $logFile = "dist\build-win.log"
          & npx tauri build --target $target 2>&1 | Tee-Object -FilePath $logFile
          $exitCode = $LASTEXITCODE
          "TAURI_EXIT=$exitCode" | Out-File -FilePath "dist\build-env.env" -Encoding utf8
          Write-Host "[Tauri build (Windows)] exit code = $exitCode"
          if ($exitCode -ne 0) {
            Write-Host "::warning::Tauri build exited with $exitCode，继续尝试便携版兜底"
          }

      - name: Generate portable zip (fallback)
        if: always()
        run: |
          node scripts/build-portable.mjs --target x86_64-pc-windows-msvc -o .

      - name: Find and copy Windows artifacts
        run: |
          $ver = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          # NSIS installer -> 规范名 nrmm-tauri_<ver>_x64-Win.exe（MSI 已移除）
          $nsis = Get-ChildItem -Path "$bundleDir/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }
          Copy-Item $nsis.FullName -Destination "nrmm-tauri_${ver}_x64-Win.exe"
          # Tauri updater latest.json（installer 已签名时由 bundler 生成）
          $latest = Get-ChildItem -Path $bundleDir -Filter "latest.json" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($latest) { Copy-Item $latest.FullName -Destination "latest-windows.json" }
          # 便携 zip（build-portable.mjs 已输出规范名 nrmm-tauri_<ver>_x64-Win.zip）
          Get-ChildItem nrmm-tauri_*,latest-* | Format-Table Name, Length
        shell: powershell

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            nrmm-tauri_*_x64-Win.exe
            nrmm-tauri_*_x64-Win.zip
            latest-windows.json

  build-linux:
    name: Build Linux (deb/rpm + portable tar.gz)
    runs-on: ubuntu-latest
    # 绑定 ubuntu:22.04 容器锁 glibc 2.35（Ubuntu 22.04 级兼容），不依赖即将弃用的 ubuntu-22.04 runner 标签
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies (Tauri)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            librust-webkit2gtk-sys-dev rpm fakeroot libfuse2 binutils
          rustup target add x86_64-unknown-linux-gnu
          npm install -g @tauri-apps/cli@2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (Linux) with log capture
        id: build_linux
        run: |
          set +e
          TARGET_TRIPLE=x86_64-unknown-linux-gnu
          mkdir -p dist
          BUILD_LOG=dist/build-linux.log
          (npm run tauri build -- --target $TARGET_TRIPLE) 2>&1 | tee "$BUILD_LOG"
          TAURI_EXIT=${PIPESTATUS[0]}
          set -e
          echo "TAURI_EXIT=$TAURI_EXIT" >> dist/build-env.env
          echo "[Tauri build (Linux)] exit code = $TAURI_EXIT"
          echo "tauri_exit=$TAURI_EXIT" >> $GITHUB_OUTPUT
          if [ "$TAURI_EXIT" != "0" ]; then
            echo "::warning::Tauri build exited with $TAURI_EXIT，继续尝试便携版兜底"
          fi

      - name: Generate portable tar.gz (含内置 7z CLI)
        if: always()
        run: |
          VER="$(node -p "require('./package.json').version")"
          mkdir -p linux-gnu
          node scripts/build-portable.mjs --target x86_64-unknown-linux-gnu -o linux-gnu

      - name: Find and copy Linux artifacts (改名到规范名，归入 linux-gnu/)
        run: |
          set -e
          VER="$(node -p "require('./package.json').version")"
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          rename_to_spec() {
            local src="$1"; [ -f "$src" ] || { echo "  [WARN] missing: $src"; return; }
            local bn; bn="$(basename "$src")"
            local dest
            case "$bn" in
              *.deb)      dest="linux-gnu/nrmm-tauri_${VER}_x64-Linux.deb" ;;
              *.rpm)      dest="linux-gnu/nrmm-tauri_${VER}_x64-Linux.rpm" ;;
              *)          dest="linux-gnu/$bn" ;;
            esac
            cp "$src" "$dest"
            echo "  [OK] $dest"
          }
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" | head -1)
          rename_to_spec "$DEB"
          RPM=$(find "$BUNDLE_DIR/rpm" -name "*.rpm" | head -1)
          rename_to_spec "$RPM"
          LATEST=$(find "$BUNDLE_DIR" -name "latest.json" | head -1)
          [ -n "$LATEST" ] && cp "$LATEST" linux-gnu/latest-linux.json
          ls -la linux-gnu/ 2>/dev/null || true

      - name: Audit glibc ceiling (must stay <= 2.35)
        run: |
          BIN="src-tauri/target/x86_64-unknown-linux-gnu/release/nrmm-tauri"
          if [ -f "$BIN" ]; then
            MAX_GLIBC="$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
            echo "max glibc symbol: ${MAX_GLIBC:-none}"
            if [ -n "$MAX_GLIBC" ] && [ "$(printf '%s\n2.35\n' "$MAX_GLIBC" | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::产物依赖 $MAX_GLIBC > 2.35，违反最低兼容约束"
              exit 1
            fi
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            linux-gnu/nrmm-tauri_*_x64-Linux.deb
            linux-gnu/nrmm-tauri_*_x64-Linux.rpm
            linux-gnu/nrmm-tauri_*_x64-Linux.tar.gz
            linux-gnu/latest-linux.json

  release:
    name: Merge manifests & create release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -laR artifacts/

      - name: Merge latest.json manifests (windows + linux 平台条目合并)
        run: |
          set -e
          node -e '
            const fs = require("fs");
            let merged = { platforms: {} };
            for (const p of ["artifacts/windows-artifacts/latest-windows.json", "artifacts/linux-artifacts/latest-linux.json"]) {
              if (fs.existsSync(p)) {
                const m = JSON.parse(fs.readFileSync(p, "utf8"));
                merged.version = m.version || merged.version;
                merged.notes = m.notes || merged.notes;
                merged.pub_date = m.pub_date || merged.pub_date;
                Object.assign(merged.platforms, m.platforms || {});
              }
            }
            if (!merged.version) { console.error("no latest.json found"); process.exit(1); }
            fs.writeFileSync("latest.json", JSON.stringify(merged, null, 2) + "\n");
            console.log("merged platforms:", Object.keys(merged.platforms).join(", "));
          '

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/windows-artifacts/nrmm-tauri_*_x64-Win.exe
            artifacts/windows-artifacts/nrmm-tauri_*_x64-Win.zip
            artifacts/linux-artifacts/linux-gnu/nrmm-tauri_*_x64-Linux.deb
            artifacts/linux-artifacts/linux-gnu/nrmm-tauri_*_x64-Linux.rpm
            artifacts/linux-artifacts/linux-gnu/nrmm-tauri_*_x64-Linux.tar.gz
            latest.json
          draft: false
          prerelease: false
          body: |
            ## nrmm-tauri ${{ github.ref_name }}

            自动构建发布（GitHub Actions）。仅支持 x86_64，最低运行环境 glibc >= 2.35（Ubuntu 22.04 及以上）。

            ### 推荐下载
            - **Linux 免安装包（含 7z）**: `nrmm-tauri_*_x64-Linux.tar.gz` — 解压即用，推荐
            - **Windows 免安装包**: `nrmm-tauri_*_x64-Win.zip` — 解压即用

            ### 其他产物（兜底）
            - **Windows NSIS 安装包**: `nrmm-tauri_*_x64-Win.exe` — 用户级安装
            - **Linux deb**: `nrmm-tauri_*_x64-Linux.deb` — 需 sudo，环境异常兜底
            - **Linux rpm**: `nrmm-tauri_*_x64-Linux.rpm` — 需 sudo，环境异常兜底

            ### 关于内置 7-Zip
            各打包产物在程序同级 `7z/` 目录内置 7-Zip。**请勿移除或改动该目录下的任何文件**：一旦缺失，
            解压回退链将降级为仅支持 zip/7z/rar，并优先调用系统 7-Zip；系统也未安装时再回退纯 Rust 解压（格式更少）。

            > Linux 构建在 `ubuntu:22.04` 容器内完成，产物天然满足 glibc 2.35 下限。
