version: '1.0'
name: nrmm-tauri-release
displayName: nrmm-tauri 发布流水线

triggers:
  push:
    tags:
      precise: []
      include:
        - '^v\d+\.\d+\.\d+$'
      prefix: []
      exclude: []

variables:
  CARGO_PROFILE_RELEASE_LTO: 'true'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  CARGO_PROFILE_RELEASE_STRIP: 'true'
  GITEE_OWNER: Yezi26
  GITEE_REPO: nrmm-tauri
  # ===== AppImage 构建兜底（核心）：即使 FUSE 不可用也能解压运行 AppImage 工具 =====
  APPIMAGE_EXTRACT_AND_RUN: '1'
  ARCH: 'x86_64'
  # ===== 关键：Ubuntu 24.04+ / Fedora39+ glibc>=2.38 默认 DT_RELR (.relr.dyn) =====
  # linuxdeploy 内置 strip 太老无法识别，会导致 failed to run linuxdeploy
  # NO_STRIP=1 让 linuxdeploy 直接跳过 strip（本项目 Cargo.toml 已做 strip=true）
  NO_STRIP: '1'
  # 同时设置系统本地 strip 作为备份，两者共存时 NO_STRIP 优先生效
  STRIP: '/usr/bin/strip'

stages:
  - stage: build-linux
    displayName: Linux 构建（zig 轨，锁 glibc 2.35）
    strategy: fast
    trigger: auto
    steps:
      - step: build@rust
        name: build_linux
        displayName: 构建 Linux (AppImage/deb/rpm + portable tar.gz)
        rustVersion: stable
        commands:
          - set -e
          - |
            echo "===== [1/5] 安装系统依赖 (Tauri Linux prerequisites) ====="
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              libsoup-3.0-dev \
              libfuse2 \
              rpm fakeroot dpkg-dev \
              curl wget file xz-utils ca-certificates binutils
            sudo apt-get install -f -y
          - |
            echo "===== [2/5] 安装 Node.js 20 ====="
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
            npm --version
          - |
            echo "===== [3/5] 安装 zig（锁 glibc 2.35 的 linker/cc/c++）====="
            # build-linux-zig.sh 依赖全局 zig；若镜像已装则跳过
            if ! command -v zig >/dev/null 2>&1; then
              ZIG_VER=0.13.0
              curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" -o /tmp/zig.tar.xz
              sudo tar -xJf /tmp/zig.tar.xz -C /opt
              sudo ln -sf /opt/zig-linux-x86_64-${ZIG_VER}/zig /usr/local/bin/zig
              rm -f /tmp/zig.tar.xz
            fi
            zig version
          - |
            echo "===== [4/5] 安装 npm 依赖 ====="
            npm ci
          - |
            echo "===== [5/5] Tauri 构建（zig 锁 glibc<=2.35，产出规范名，归入 dist-linux/zig/）====="
            # 改用 zig 轨脚本：无论宿主镜像 glibc 多新，产物均锁 2.35；已包含 AppImage/deb/rpm + 含7z/no7z 两版 tar.gz
            bash scripts/build-linux-zig.sh
          - |
            echo "===== 收集构建产物到 dist/（供发布步骤使用）====="
            set -e
            mkdir -p dist
            cp -r dist-linux/zig/. dist/ 2>/dev/null || true
            echo "--- dist/ contents ---"
            ls -la dist/ 2>/dev/null || echo "  dist/ is empty"
        artifacts:
          - name: LINUX_BUILD
            path:
              - dist/

  - stage: release
    displayName: 创建 Release 并上传
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 合并 Manifest & 发布到 Gitee Releases
        nodeVersion: 20.11.0
        dependArtifact: LINUX_BUILD
        commands:
          - set -e
          - |
            echo "===== 准备发布环境 ====="
            echo "Artifact dir: ${LINUX_BUILD}"
            ls -la "${LINUX_BUILD}/" || true
            node --version
          - |
            echo "===== 生成 updater manifest (latest.json) ====="
            # zig 脚本已将 bundler 的 latest-linux.json 拷入 dist/；直接作为 latest.json 发布
            if [ -f "${LINUX_BUILD}/latest-linux.json" ]; then
              cp "${LINUX_BUILD}/latest-linux.json" latest.json
              echo "--- latest.json ---"
              cat latest.json
            else
              echo "WARN: 未找到 latest-linux.json，跳过 manifest"
            fi
          - |
            echo "===== 创建/更新 Release 并上传附件 ====="
            export GITEE_TAG="${GITEE_TAG:-${GITEE_BRANCH}}"
            node scripts/gitee-release.mjs "${LINUX_BUILD}"
