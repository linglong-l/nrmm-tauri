version: '1.0'
name: nrmm-rust-release
displayName: nrmm-rust 发布流水线

triggers:
  push:
    tags:
      precise: []
      include:
        - '^v\d+\.\d+\.\d+$'
      prefix: []
      exclude: []

variables:
  CARGO_PROFILE_RELEASE_LTO: 'true'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  CARGO_PROFILE_RELEASE_STRIP: 'true'
  GITEE_OWNER: Yezi26
  GITEE_REPO: nrmm-tauri
  # ===== AppImage 构建兜底（核心）：即使 FUSE 不可用也能解压运行 AppImage 工具 =====
  APPIMAGE_EXTRACT_AND_RUN: '1'
  ARCH: 'x86_64'

stages:
  - stage: build-linux
    displayName: Linux 构建
    strategy: fast
    trigger: auto
    steps:
      - step: build@rust
        name: build_linux
        displayName: 构建 Linux (AppImage/deb/rpm + portable tar.gz)
        rustVersion: stable
        commands:
          - set -e
          - |
            echo "===== [0/11] 构建前环境检查 (verify-build.mjs pre) ====="
            node scripts/verify-build.mjs pre || { echo "[WARN] pre 检查有警告/失败，继续尝试构建"; }
          - |
            echo "===== [1/11] 安装系统依赖 (Tauri Linux prerequisites) ====="
            sudo apt-get update -y
            # 优先装最新 webkitgtk-4.1，失败则回退到 4.0；最后 apt-get install -f 修复依赖破损
            (sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev) \
              || sudo apt-get install -y --no-install-recommends \
                   libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev
            sudo apt-get install -y --no-install-recommends \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              libsoup-3.0-dev \
              libfuse2 \
              rpm fakeroot dpkg-dev \
              curl wget file xz-utils ca-certificates
            sudo apt-get install -f -y
          - |
            echo "===== [2/11] 安装 Node.js 20 ====="
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
            npm --version
          - |
            echo "===== [3/11] 配置 Rust target ====="
            rustup target add x86_64-unknown-linux-gnu
            rustc --version
          - |
            echo "===== [4/11] 安装 Tauri CLI ====="
            npm install -g @tauri-apps/cli@2
          - |
            echo "===== [5/11] 安装 npm 依赖 ====="
            npm ci
          - |
            echo "===== [6/11] 构建前版本校验 (verify-tauri-release.mjs pre) ====="
            npm run verify:release
          - |
            echo "===== [7/11] Tauri 构建（保存日志 + 单 target 失败不中断：后续 build-portable 兜底） ====="
            TARGET_TRIPLE=x86_64-unknown-linux-gnu
            BUILD_LOG=dist/build-linux.log
            mkdir -p dist
            # 开启 set +e，构建失败时不终止，而是记录退出码继续走兜底
            set +e
            (npm run tauri build -- --target $TARGET_TRIPLE) 2>&1 | tee "$BUILD_LOG"
            TAURI_EXIT=${PIPESTATUS[0]}
            set -e
            echo "[Tauri build] exit code = $TAURI_EXIT"
            echo "TAURI_EXIT=$TAURI_EXIT" >> dist/build-env.env
          - |
            echo "===== [8/11] 扫描构建日志异常 (verify-build.mjs scan) ====="
            set +e
            node scripts/verify-build.mjs scan dist/build-linux.log
            SCAN_EXIT=$?
            set -e
            echo "[Log scan] exit code = $SCAN_EXIT"
          - |
            echo "===== [9/11] 兜底：生成 Linux 便携版 tar.gz（即使 Tauri build 失败也尝试执行） ====="
            TARGET_TRIPLE=x86_64-unknown-linux-gnu
            # 便携版只依赖 release/nrmm-rust 可执行文件，只要 Rust 编译完成哪怕 bundler 报错也能产出
            node scripts/build-portable.mjs --target $TARGET_TRIPLE -o dist
          - |
            echo "===== [10/11] 构建后产物完整性检查 (verify-build.mjs post) ====="
            set +e
            node scripts/verify-build.mjs post --target x86_64-unknown-linux-gnu
            POST_EXIT=$?
            set -e
            echo "[Post verify] exit code = $POST_EXIT"
            # 最终决策：如果 tauri build 失败且便携版也失败，则整体失败
            if [ -f dist/build-env.env ]; then . dist/build-env.env; fi
            PORTABLE_FOUND=$(ls dist/nrmm-rust-portable-*.tar.gz 2>/dev/null | head -1 || true)
            if [ -n "$PORTABLE_FOUND" ]; then
              echo "[FALLBACK OK] 便携版 tar.gz 存在，作为兜底产物: $PORTABLE_FOUND"
            else
              echo "[FALLBACK FAIL] 便携版也未生成"
            fi
            if [ "${TAURI_EXIT:-0}" != "0" ] && [ -z "$PORTABLE_FOUND" ]; then
              echo "!! Tauri 构建失败且无兜底产物，终止流水线"
              exit 1
            fi
          - |
            echo "===== [11/11] 收集构建产物 ====="
            set +e
            TARGET_TRIPLE=x86_64-unknown-linux-gnu
            BUNDLE_DIR="src-tauri/target/$TARGET_TRIPLE/release/bundle"
            mkdir -p dist
            copy_if_exists() {
              local src="$1"; local dst="$2"
              if [ -f "$src" ]; then
                cp "$src" "$dst"
                echo "  [OK] $(basename "$dst")"
              else
                echo "  [WARN] $(basename "$dst") not found at $src" >> dist/build-warnings.log
              fi
            }
            copy_if_exists "$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage' 2>/dev/null | head -1)" \
                          "dist/nrmm-rust-x86_64.AppImage"
            copy_if_exists "$(find "$BUNDLE_DIR/deb" -maxdepth 1 -name '*.deb' 2>/dev/null | head -1)" \
                          "dist/nrmm-rust-x86_64.deb"
            copy_if_exists "$(find "$BUNDLE_DIR/rpm" -maxdepth 1 -name '*.rpm' 2>/dev/null | head -1)" \
                          "dist/nrmm-rust-x86_64.rpm"
            # portable tar.gz 由 build-portable.mjs 直接输出到 dist/
            if [ -f "dist/nrmm-rust-portable-x86_64.tar.gz" ]; then
              echo "  [OK] nrmm-rust-portable-x86_64.tar.gz"
            else
              echo "  [WARN] nrmm-rust-portable-x86_64.tar.gz not generated" >> dist/build-warnings.log
            fi
            copy_if_exists "$(find "$BUNDLE_DIR" -maxdepth 3 -name 'latest.json' 2>/dev/null | head -1)" \
                          "dist/latest-linux.json"
            echo "--- dist/ contents ---"
            ls -la dist/ 2>/dev/null || echo "  dist/ is empty"
            echo "--- dist/build-warnings.log (如有) ---"
            [ -f dist/build-warnings.log ] && cat dist/build-warnings.log || true
        artifacts:
          - name: LINUX_BUILD
            path:
              - dist/

  - stage: release
    displayName: 创建 Release 并上传
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 合并 Manifest & 发布到 Gitee Releases
        nodeVersion: 20.11.0
        dependArtifact: LINUX_BUILD
        commands:
          - set -e
          - |
            echo "===== 准备发布环境 ====="
            echo "Artifact dir: ${LINUX_BUILD}"
            ls -la "${LINUX_BUILD}/" || true
            node --version
          - |
            echo "===== 合并 latest.json ====="
            LINUX_LATEST="${LINUX_BUILD}/latest-linux.json"
            INPUTS=""
            [ -f "$LINUX_LATEST" ] && INPUTS="$INPUTS $LINUX_LATEST"
            if [ -n "$INPUTS" ]; then
              node scripts/merge-updater-manifest.mjs $INPUTS -o latest.json
              echo "--- merged latest.json ---"
              cat latest.json
            else
              echo "WARN: 未找到 latest.json，跳过 manifest 合并"
            fi
          - |
            echo "===== 创建/更新 Release 并上传附件 ====="
            export GITEE_TAG="${GITEE_TAG:-${GITEE_BRANCH}}"
            node scripts/gitee-release.mjs "${LINUX_BUILD}"
