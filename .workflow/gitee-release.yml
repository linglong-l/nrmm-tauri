version: '1.0'
name: nrmm-tauri-release
displayName: nrmm-tauri 发布流水线

triggers:
  push:
    tags:
      precise: []
      include:
        - '^v\d+\.\d+\.\d+$'
      prefix: []
      exclude: []

variables:
  CARGO_PROFILE_RELEASE_LTO: 'true'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  CARGO_PROFILE_RELEASE_STRIP: 'true'
  GITEE_OWNER: Yezi26
  GITEE_REPO: nrmm-tauri
  ARCH: 'x86_64'

stages:
  - stage: build-linux
    displayName: Linux 构建（gnu 原生工具链，Ubuntu 22.04）
    strategy: fast
    trigger: auto
    steps:
      - step: build@rust
        name: build_linux
        displayName: 构建 Linux (deb/rpm + portable tar.gz)
        rustVersion: stable
        commands:
          - set -e
          - |
            echo "===== [1/4] 安装系统依赖 (Tauri Linux prerequisites) ====="
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              libsoup-3.0-dev \
              rpm fakeroot dpkg-dev \
              curl wget file xz-utils ca-certificates binutils
            sudo apt-get install -f -y
          - |
            echo "===== [2/4] 安装 Node.js 20 ====="
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
            npm --version
          - |
            echo "===== [3/4] 安装 npm 依赖 ====="
            npm ci
          - |
            echo "===== [4/4] Tauri 构建（gnu 原生工具链，Ubuntu 22.04 宿主 glibc=2.35 即兼容下限）====="
            bash scripts/build-linux-gnu.sh
          - |
            echo "===== 收集构建产物到 dist/（供发布步骤使用）====="
            set -e
            mkdir -p dist
            cp -r dist-linux/. dist/ 2>/dev/null || true
            echo "--- dist/ contents ---"
            ls -la dist/ 2>/dev/null || echo "  dist/ is empty"
        artifacts:
          - name: LINUX_BUILD
            path:
              - dist/

  - stage: release
    displayName: 创建 Release 并上传
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 合并 Manifest & 发布到 Gitee Releases
        nodeVersion: 20.11.0
        dependArtifact: LINUX_BUILD
        commands:
          - set -e
          - |
            echo "===== 准备发布环境 ====="
            echo "Artifact dir: ${LINUX_BUILD}"
            ls -la "${LINUX_BUILD}/" || true
            node --version
          - |
            echo "===== 生成 updater manifest (latest.json) ====="
            # gnu 脚本已将 bundler 的 latest-linux.json 拷入 dist/；直接作为 latest.json 发布
            if [ -f "${LINUX_BUILD}/latest-linux.json" ]; then
              cp "${LINUX_BUILD}/latest-linux.json" latest.json
              echo "--- latest.json ---"
              cat latest.json
            else
              echo "WARN: 未找到 latest-linux.json，跳过 manifest"
            fi
          - |
            echo "===== 创建/更新 Release 并上传附件 ====="
            export GITEE_TAG="${GITEE_TAG:-${GITEE_BRANCH}}"
            node scripts/gitee-release.mjs "${LINUX_BUILD}"
