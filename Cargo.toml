[workspace]
members = [
    "src-tauri"
]
resolver = "2"
# vendor/ 只是被 patch 引用的第三方源码副本（见下方 [patch.crates-io]），
# 不参与工作区自身构建，显式排除避免被当成普通成员参与 feature/profile 统一解析。
exclude = [
    "vendor"
]

# ---------------------------------------------------------------------------
# 测试分支专用：unrar-ng-sys 本地副本（vendor/unrar_ng_sys，基线 = crates.io 0.7.7）
#
# 目的：用活跃复刻 unrar-ng 替换原 unrar，并在 build.rs 中硬化 -fPIC 处理，
#       解决 Linux 用 zigbuild 交叉编译链接 cdylib 时的
#       relocation ... recompile with -fPIC / the selected target requires position independent code 失败。
# 与上游的唯一差异（build.rs）：
#   1) 强制 `.pic(true)` + `.flag("-fPIC")`（对 MSVC/wasi/emscripten 跳过），
#      不再依赖 `flag_if_supported` 的编译器探测。
#   2) 清洗构建环境可能注入的 `-fno-pic`/`-fno-PIC`（CFLAGS/CXXFLAGS）：
#      zig cc 在显式收到 -fno-pic 时会于【编译期】硬报错，而 gcc 只静默产出
#      非 PIC 对象、最后链接才报 recompile with -fPIC —— 这正是「仅 zigbuild 炸」的根因。
# 验证完毕若不需要，删除本 [patch.crates-io] 段与 vendor/ 目录即可完全回退。
# ---------------------------------------------------------------------------
[patch.crates-io]
unrar-ng-sys = { path = "vendor/unrar_ng_sys" }

# release 性能配置（2026-08-18 修订）：
# - opt-level = 3：速度最大优化。原 "z"（最小体积）是 Tauri 模板默认，会禁用向量化/内联，
#   对 INI 解析/序列化等 CPU 密集热路径损失显著（update_mod_data 实测受此拖累），体积换性能
# - lto = true / codegen-units = 1：全程序 LTO + 单代码生成单元，跨 crate 内联
# - panic = "unwind"：项目依赖 catch_unwind 做模组级/组级 panic 隔离（硬约束），禁止 abort
# - strip = true / debug = false：去除调试符号控制体积
[profile.release]
debug = false
strip = true
lto = true
panic = "unwind"
opt-level = 3
codegen-units = 1

# dev/test 依赖运行时加速（平台无关，2026-08-18）：
# 依赖（registry/path 依赖，不含本工作区 crate）按 opt-level=2 编译，本 crate 保持
# 默认 0 级以保留增量编译速度。背景：实测 dev 模式 update_mod_data 65.6s vs release
# 41.9s，0 级依赖是差距来源之一；此设置收窄 dev 运行时差距且不拖慢 rust 增量重编译。
# 注意：首次构建会以 2 级重编全部依赖（一次性成本，之后走缓存）。
[profile.dev.package."*"]
opt-level = 2
