[workspace]
members = [
    "src-tauri"
]
resolver = "2"

# release 性能配置（2026-08-18 修订）：
# - opt-level = 3：速度最大优化。原 "z"（最小体积）是 Tauri 模板默认，会禁用向量化/内联，
#   对 INI 解析/序列化等 CPU 密集热路径损失显著（update_mod_data 实测受此拖累），体积换性能
# - lto = true / codegen-units = 1：全程序 LTO + 单代码生成单元，跨 crate 内联
# - panic = "unwind"：项目依赖 catch_unwind 做模组级/组级 panic 隔离（硬约束），禁止 abort
# - strip = true / debug = false：去除调试符号控制体积
[profile.release]
debug = false
strip = true
lto = true
panic = "unwind"
opt-level = 3
codegen-units = 1

# dev/test 依赖运行时加速（平台无关，2026-08-18）：
# 依赖（registry/path 依赖，不含本工作区 crate）按 opt-level=2 编译，本 crate 保持
# 默认 0 级以保留增量编译速度。背景：实测 dev 模式 update_mod_data 65.6s vs release
# 41.9s，0 级依赖是差距来源之一；此设置收窄 dev 运行时差距且不拖慢 rust 增量重编译。
# 注意：首次构建会以 2 级重编全部依赖（一次性成本，之后走缓存）。
[profile.dev.package."*"]
opt-level = 2
