[package]
name = "nrmm-rust"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "xxmi_nrmm_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
# 移除调试符号（发布时必备）
debug = false
# 剥离符号表，进一步减小体积
strip = true
# 启用 fat LTO，最大化跨模块优化，减小体积
lto = true
# 这会减小体积，但会失去栈回溯能力，视情况开启
panic = "abort"
# 优化级别：z 或 s (推荐 z 用于极致压缩)
opt-level = "z"
# 单代码生成单元，牺牲编译时间换取更优的二进制体积
codegen-units = 1

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
log = "0.4"
fern = "0.7"
dirs = "5"
anyhow = "1.0"
thiserror = "2.0"
walkdir = "2.5"
notify = "8.2"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.12"
ini = "1.3"
parking_lot = "0.12"
rayon = "1.12"
sysinfo = "0.39"
zip = { version = "0.6", features = ["deflate"] }
sevenz-rust = "0.6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Graphics_Gdi",
  "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
