[package]
name = "nrmm-rust"
version = "0.4.0"
description = "A Tauri App"
authors = ["ye"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "xxmi_nrmm_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["rustls-tls", "protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
notify = { version = "8.2", features = ["serde"] }
walkdir = "2"
zip = { version = "8.6", default-features = true }
regex = "1"
dirs = "6"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
rayon = "1.12"
infer = "0.16"
sevenz-rust = "0.6"
unrar = "0.5"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_System_Environment",
] }

[target.'cfg(linux)'.dependencies]
x11-dl = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", optional = true }
core-foundation = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"

# cargo machete 忽略列表：
# - tauri-build      ：build.rs 中 `tauri_build::build()` 使用（build-dependency）
# - x11-dl           ：Linux 平台 target（当前 Windows 下 machete 静态检测不到引用）
# - core-graphics / core-foundation：macOS 平台 target（同上）
# 以上均为「隐式/平台条件」依赖，实际需要，故在此忽略而非删除。
[package.metadata.cargo-machete]
ignored = ["tauri-build", "x11-dl", "core-graphics", "core-foundation"]
