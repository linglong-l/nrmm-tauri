[package]
name = "nrmm-tauri"
version = "0.5.0"
description = "A Tauri App"
authors = ["ye"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "xxmi_nrmm_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = [
  "rustls-tls",
  "protocol-asset",
  "tray-icon",
] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
notify = { version = "8.2", features = ["serde"] }
walkdir = "2"
zip = { version = "8.6", default-features = true }
regex = "1"
encoding_rs = "0.8"
dirs = "6"
reqwest = { version = "0.13", features = [
  "blocking",
  "json",
  "rustls",
], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
rayon = "1.12"
infer = "0.22"
# 缩略图生成（WebView 内存优化）：解码模组预览图原图并缩放后落盘缓存，
# 前端加载缩略图而非原图（100x140 显示区加载 4K 原图会解码出 8-33MB 位图，滚动浏览破 GB）
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
  "bmp",
] }
sevenz-rust = "0.6"
# unrar-ng（活跃复刻 unrar）：抽取专用 + 批抽取性能更优。
# 用 package 别名 `unrar` 保持既有 `use unrar::Archive;` 代码不变（最小化改动）。
# 真正的 C++ 绑定 unrar-ng-sys 由根 Cargo.toml 的 [patch.crates-io] 指向本地硬化副本 vendor/unrar_ng_sys。
unrar = { package = "unrar-ng", version = "0.7" }
trash = "5"
# 全局分配器切换为 mimalloc（C-6）：小对象密集 + 多线程分配（缓存树/rayon 并扫）场景下
# 碎片率与锁竞争低于系统默认分配器；预期后端常驻降低并改善长跑 RSS 增长。
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_System_Environment",
] }

[target.'cfg(linux)'.dependencies]
x11-dl = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", optional = true }
core-foundation = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"

# cargo machete 忽略列表：
# - tauri-build      ：build.rs 中 `tauri_build::build()` 使用（build-dependency）
# - x11-dl           ：Linux 平台 target（当前 Windows 下 machete 静态检测不到引用）
# - core-graphics / core-foundation：macOS 平台 target（同上）
# 以上均为「隐式/平台条件」依赖，实际需要，故在此忽略而非删除。
# release 性能配置位于工作区根 Cargo.toml（非 root package 的 profile 会被 Cargo 忽略）。
[package.metadata.cargo-machete]
ignored = ["tauri-build", "x11-dl", "core-graphics", "core-foundation"]
