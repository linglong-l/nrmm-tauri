[package]
name = "nrmm-rust"
version = "0.4.0"
description = "A Tauri App"
authors = ["ye"]
edition = "2021"

[lib]
name = "xxmi_nrmm_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
debug = false
strip = true
lto = true
panic = "abort"
opt-level = "z"
codegen-units = 1

[dependencies]
tauri = { version = "2", features = ["rustls-tls", "protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
notify = { version = "8.2", features = ["serde"] }
walkdir = "2"
zip = { version = "8.6", default-features = true }
regex = "1"
dirs = "6"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
base64 = "0.23"
parking_lot = "0.12"
global-hotkey = "0.8"
tray-icon = "0.24"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rayon = "1.12"
infer = "0.16"
fs_extra = "1.3"
sevenz-rust = "0.6"
unrar = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_System_Environment",
] }

[target.'cfg(linux)'.dependencies]
x11-dl = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", optional = true }
core-foundation = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
