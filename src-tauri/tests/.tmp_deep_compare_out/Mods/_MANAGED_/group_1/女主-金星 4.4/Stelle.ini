[Constants]
global $managed_slot_id = 5
global $activeStelle
global persist $face = 1
global persist $hair = 1
global persist $legs = 1
global persist $ribbon = 0

[Present]
if $managed_slot_id == $\modmanageragl\group_1\active_slot
    post $activeStelle = 0
endif

[KeySwaphair]
key = vk_up
condition = ($activeStelle == 1) && $managed_slot_id == $\modmanageragl\group_1\active_slot
type = cycle
$hair = 0,1,2,3

[KeySwapface]
key = vk_right
condition = ($activeStelle == 1) && $managed_slot_id == $\modmanageragl\group_1\active_slot
type = cycle
$face = 0,1

[KeySwaplegs]
key = vk_left
condition = ($activeStelle == 1) && $managed_slot_id == $\modmanageragl\group_1\active_slot
type = cycle
$legs = 0,1

[KeySwapribbon]
key = vk_down
condition = ($activeStelle == 1) && $managed_slot_id == $\modmanageragl\group_1\active_slot
type = cycle
$ribbon = 0,1

