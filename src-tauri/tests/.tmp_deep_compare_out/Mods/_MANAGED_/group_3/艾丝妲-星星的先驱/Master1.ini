namespace = 1\master_1
; Constants ---------------------------

[Constants]
global $managed_slot_id = 9
global persist $swapvar = 0
global $\1\master_1\active
global $creditinfo = 0

[KeySwap]
condition = $managed_slot_id == $\modmanageragl\group_3\active_slot
;-;condition = ($\1\master_1\active == 1) && $\1\master_1\managed_slot_id == $\modmanageragl\group_3\active_slot
key = /
back = .
type = cycle
$\1\master_1\swapvar = 1,2
$\1\master_1\creditinfo = 0

[Present]
if $managed_slot_id == $\modmanageragl\group_3\active_slot
    ;-;if $\1\master_1\managed_slot_id == $\modmanageragl\group_3\active_slot
    post $active = 0
endif
; Overrides ---------------------------

[TextureOverride1Position]
match_priority = 0
if $managed_slot_id == $\modmanageragl\group_3\active_slot
    if $\1\master_1\managed_slot_id == $\modmanageragl\group_3\active_slot
        $\1\master_1\active = 1
    endif
endif


