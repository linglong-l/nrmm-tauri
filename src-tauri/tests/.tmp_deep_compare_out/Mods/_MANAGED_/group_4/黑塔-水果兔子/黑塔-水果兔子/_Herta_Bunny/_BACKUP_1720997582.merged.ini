; Constants ---------------------------

[Constants]
global $managed_slot_id = 8
global persist $swapvar = 0
global persist $sfw = 0
global persist $uw = 0

global $active
global $creditinfo = 0

[KeySwap]
condition = ($active == 1) && $managed_slot_id == $\modmanageragl\group_4\active_slot
key = VK_RIGHT
back = VK_LEFT
type = cycle
$swapvar = 0,1,2
$creditinfo = 0

[KeyUW]
condition = ($active == 1) && $managed_slot_id == $\modmanageragl\group_4\active_slot
key = VK_DOWN
type = cycle
$uw = 0,1
$creditinfo = 0

[KeySFW]
condition = $managed_slot_id == $\modmanageragl\group_4\active_slot
key = k
type = cycle
$sfw = 0,1
$creditinfo = 0
run = CommandListSFW

[Present]
if $managed_slot_id == $\modmanageragl\group_4\active_slot
    post $active = 0
    run = CommandListCreditInfo
endif

